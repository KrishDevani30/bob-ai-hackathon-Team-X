submission:
  title: "Clinical Trial Risk Monitor"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Clinical trial risk managers and clinical operations teams need to identify protocol deviations before they become audit findings. In large oncology trials, missed or out-of-window visits, dosing issues, prohibited medications, missing safety assessments, late data entry, and eligibility violations are difficult to detect across thousands of records.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    Clinical Trial Risk Monitor is a FastAPI and Streamlit decision-support application that analyzes protocol and visit data, detects deviations, classifies severity, and scores site-level risk. It combines deterministic protocol rules with optional watsonx.ai-assisted classification and generates CAPA narratives and exportable reports for earlier investigation.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Protocol-aware detection of seven clinical trial deviation types"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Hybrid LLM and deterministic ICH E6(R2)-aligned severity classification"
    - "Transparent site-level risk scoring from six leading indicators"
    - "Streamlit dashboard with overview, site risk, and deviation drill-down views"                               # optional 4th
    - "CAPA narrative generation with DOCX and PDF export"                               # optional 5th

  tech_stack:
    languages: ["Python"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "Streamlit", "Pydantic", "SQLAlchemy"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "PostgreSQL", "Db2"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["pandas", "NumPy", "Plotly", "pytest", "python-docx", "ReportLab", "Uvicorn"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Our strongest work is the transparent, protocol-aware risk pipeline. Deterministic detection rules provide reproducible findings, while the hybrid classifier preserves human oversight by enforcing severity floors for safety-critical and eligibility-related deviations.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    This prototype uses synthetic data and is not validated for GxP or regulatory use. Authentication and production deployment controls are not implemented, and watsonx.ai integration is optional because the default deterministic mock supports local demos without API credentials.

